<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Village Account | Gro-Hit</title>
  <meta name="theme-color" content="#1b5e20" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <script src="i18n.js"></script>
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .auth-box {
      background: #ffffff;
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <img src="logo.png" alt="GROHIT Logo" style="width:64px; height:64px; margin-bottom:10px;" />
      <h2 style="color:#1b5e20; font-size:1.6rem; margin-bottom:4px;">Create Village ID</h2>
      <p style="color:#4a5c4d; font-size:0.92rem; margin-bottom:20px;">Register for easy issue tracking and Panchayat services (ग्राम पहचान पत्र)</p>

      <form id="createForm" class="form" style="text-align:left;">
        <div class="form-group">
          <label>Full Name / पूरा नाम *</label>
          <input type="text" id="regName" placeholder="e.g. Ramesh Kumar" required />
        </div>

        <div class="form-group">
          <label>Mobile Number / मोबाइल नंबर *</label>
          <input type="tel" id="regPhone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required />
        </div>

        <div class="form-group">
          <label>Village Ward / ग्राम मोहल्ला</label>
          <input type="text" id="regWard" placeholder="e.g. Ward 4, Near Temple" />
        </div>

        <div class="form-group">
          <label>Role / भूमिका *</label>
          <select id="regRole">
            <option value="villager">🟢 Villager / ग्रामीण नागरिक</option>
            <option value="health">🔵 Health Worker / आशा - स्वास्थ्य कर्मी</option>
            <option value="admin">🔴 Panchayat Admin / ग्राम प्रधान - सचिव</option>
          </select>
        </div>

        <button type="submit" class="btn primary" style="width:100%; margin-top:8px;">✅ Generate My Village ID Card</button>
      </form>

      <div style="margin-top:20px; padding-top:16px; border-top:1.5px solid var(--border); font-size:0.92rem;">
        <span style="color:#4a5c4d;">Already registered?</span>
        <a href="login.html" style="font-weight:bold; color:#1b5e20; margin-left:6px;">Log in here &rarr;</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const createForm = document.getElementById("createForm");
      createForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("regName").value.trim();
        const phone = document.getElementById("regPhone").value.trim();
        const role = document.getElementById("regRole").value;
        const ward = document.getElementById("regWard").value.trim();

        // Generate memorable ID
        const generatedId = "VID-" + Math.floor(1000 + Math.random() * 9000);

        let users = JSON.parse(localStorage.getItem("users") || "[]");
        users.push({
          name: name,
          phone: phone,
          id: generatedId,
          role: role,
          ward: ward,
          time: new Date().toLocaleString("en-IN")
        });
        localStorage.setItem("users", JSON.stringify(users));

        // Save session
        localStorage.setItem("userUniqueID", generatedId);
        localStorage.setItem("userId", generatedId);
        localStorage.setItem("userName", name);
        localStorage.setItem("userPhone", phone);
        localStorage.setItem("role", role);

        window.location.href = `register.html?id=${generatedId}&name=${encodeURIComponent(name)}&role=${role}`;
      });
    });
  </script>
  <script src="ai-assistant.js"></script>
</body>
</html>
